  firebase_core: ^3.12.1
  firebase_auth: ^5.5.1
  cloud_firestore: ^5.6.5
  firebase_storage: ^12.4.4

  # Other packages
  another_flushbar: ^1.12.30
  go_router: ^14.8.1
