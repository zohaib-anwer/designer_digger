version: 1.0.0+1

environment:
  sdk: '>=3.7.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  flutter_staggered_grid_view: ^0.7.0
  get_storage: ^2.1.1
  fluttertoast: ^8.2.12
